<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consolidador de CSV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Consolidador de CSV</h1>
    <p>Empilhe várias bases CSV ou Excel em um único arquivo, na ordem da lista. Os arquivos são lidos apenas no seu navegador e nada é enviado para fora.</p>
  </header>

  <main class="layout">
    <section class="panel inputs" aria-labelledby="h-files">
      <h2 id="h-files">Arquivos</h2>

      <input type="file" id="file-input" class="visually-hidden" accept=".csv,.txt,.xlsx,.xlsm,.xls,text/csv" multiple>
      <label for="file-input" class="dropzone" id="dropzone">
        <strong>Arraste os arquivos CSV ou Excel aqui</strong>
        <span>ou clique para escolher. Em CSV, separador e codificação são detectados automaticamente. Em Excel, cada aba com dados entra como uma base.</span>
      </label>

      <p id="file-empty" class="empty">Nenhum arquivo adicionado ainda.</p>
      <ol id="file-list" class="file-list"></ol>

      <div class="list-actions">
        <button id="btn-clear" class="btn-ghost" type="button" disabled>Remover todos</button>
      </div>
    </section>

    <section class="panel options" aria-labelledby="h-options">
      <h2 id="h-options">Como juntar</h2>

      <fieldset>
        <legend>Alinhar colunas</legend>
        <label class="radio">
          <input type="radio" name="mode" value="name" checked>
          <span>
            <strong>Pelo nome do cabeçalho</strong>
            <small>Colunas com o mesmo nome ficam juntas, mesmo em ordens diferentes. Se uma base não tiver a coluna, ela fica vazia.</small>
          </span>
        </label>
        <label class="radio">
          <input type="radio" name="mode" value="position">
          <span>
            <strong>Pela posição</strong>
            <small>A 1ª coluna de cada arquivo vai para a 1ª coluna, e assim por diante. Usa o cabeçalho do primeiro arquivo.</small>
          </span>
        </label>
      </fieldset>

      <label class="check">
        <input type="checkbox" id="opt-source" checked>
        <span>Adicionar coluna com o nome do arquivo de origem</span>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Separador do arquivo final</span>
          <select id="opt-delimiter">
            <option value=";" selected>Ponto e vírgula (Excel em português)</option>
            <option value=",">Vírgula</option>
            <option value="\t">Tabulação</option>
          </select>
        </label>
        <label class="field">
          <span>Nome do arquivo</span>
          <input type="text" id="opt-filename" value="consolidado.csv" spellcheck="false">
        </label>
        <label class="field">
          <span>Decimal dos números do Excel</span>
          <select id="opt-decimal">
            <option value="," selected>Vírgula (1234,56)</option>
            <option value=".">Ponto (1234.56)</option>
          </select>
        </label>
      </div>

      <button id="btn-download" class="btn-primary" type="button" disabled>Baixar CSV consolidado</button>
    </section>

    <section class="panel result" aria-labelledby="h-preview">
      <div class="result-head">
        <h2 id="h-preview">Prévia</h2>
        <p id="summary" class="summary"></p>
      </div>
      <div class="table-wrap" id="preview-wrap" tabindex="0" aria-label="Prévia da base consolidada">
        <table id="preview"></table>
      </div>
      <p id="preview-note" class="note"></p>
    </section>
  </main>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
